version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: sakukeluarga_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-RootSecurePass2026!}
      MYSQL_DATABASE: ${DB_NAME:-finance_tracker}
      MYSQL_USER: ${DB_USER:-finance_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-FinanceAppSecurePass2026!}
    volumes:
      - db_data:/var/lib/mysql
      - ./deployment/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - finance_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-RootSecurePass2026!}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sakukeluarga_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: mysql+pymysql://${DB_USER:-finance_app}:${DB_PASSWORD:-FinanceAppSecurePass2026!}@db:3306/${DB_NAME:-finance_tracker}
      SECRET_KEY: ${SECRET_KEY:-SUPER_SECRET_PRODUCTION_KEY_SAKUKELUARGA_2026_CHANGE_ME}
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      UPLOAD_DIR: /app/private_uploads
      CORS_ORIGINS: '["https://${DOMAIN_NAME:-localhost}"]'
    volumes:
      - uploads_data:/app/private_uploads
    networks:
      - finance_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    container_name: sakukeluarga_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - finance_net

  nginx:
    image: nginx:alpine
    container_name: sakukeluarga_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - finance_net

networks:
  finance_net:
    driver: bridge

volumes:
  db_data:
  uploads_data:
  certbot_data:
